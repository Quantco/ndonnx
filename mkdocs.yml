site_name: ndonnx
site_description: Export Array API compliant code to ONNX
site_url: https://ndonnx.readthedocs.io/
theme:
  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - content.action.edit
    - search.suggest
    - search.highlight
    - content.code.annotate
    - content.code.copy
    - navigation.tabs
  icon:
    repo: fontawesome/brands/github-alt
    edit: material/pencil
repo_name: quantco/ndonnx
repo_url: https://github.com/quantco/ndonnx
edit_uri: edit/main/docs/
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          inventories:
            - https://docs.python.org/3/objects.inv
            - https://spox.readthedocs.io/en/latest/objects.inv
            - https://numpy.org/doc/stable/objects.inv
            - https://onnx.ai/onnx/objects.inv
          # https://mkdocstrings.github.io/python
          paths: [ndonnx]
          options:
            filters:
              - "!^_" # Disable all single underscore methods ("protected")
              # - "^__" # re-enable double underscore methods ("dunder")
            extensions:
              - griffe_inherited_docstrings:
                  merge: true
            allow_inspection: true
            members_order: alphabetical
            signature_crossrefs: true
            show_if_no_docstring: true
            show_signature_annotations: true
            show_signature: true
            show_source: false
            show_symbol_type_heading: true
            docstring_style: numpy
            docstring_section_style: list
            separate_signature: true
            merge_init_into_class: true
            inherited_members: true

nav:
  - Welcome: index.md
  - Guides:
      - Getting started: gettingstarted.md
      - Spox interoperability: spoxintegration.md
  - Advanced use cases:
      - Experimental features: experimental.md
      - Inference: inference.md
      - Adding metadata to an artifact: adding-metadata.md
  - API Documentation:
      - Namespace: api/namespace.md
      - Array: api/array.md
      - DType: api/dtype.md
      - Extensions: api/extensions.md
      - Types: api/types.md
      - Data types: datatypes.md
  - Changelog: CHANGELOG.md
  - Motivation: motivation.md

markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.snippets
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true
