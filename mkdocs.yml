site_name: ndonnx
site_description: Export Array API compliant code to ONNX
site_url: https://ndonnx.readthedocs.io/
theme:
  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - content.action.edit
    - search.suggest
    - search.highlight
    - content.code.annotate
    - content.code.copy
    - navigation.tabs
  icon:
    repo: fontawesome/brands/github-alt
    edit: material/pencil
repo_name: quantco/ndonnx
repo_url: https://github.com/quantco/ndonnx
edit_uri: edit/main/docs/
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          inventories:
            - https://docs.python.org/3/objects.inv
            - https://spox.readthedocs.io/en/latest/objects.inv
            - https://numpy.org/doc/stable/objects.inv
            - https://onnx.ai/onnx/objects.inv
          # https://mkdocstrings.github.io/python
          paths: [ndonnx]
          options:
            filters:
              - "!^_" # Disable all single underscore methods ("protected")
              # - "^__" # re-enable double underscore methods ("dunder")
            extensions:
              - griffe_inherited_docstrings:
                  merge: true
            allow_inspection: true
            members_order: alphabetical
            signature_crossrefs: true
            show_if_no_docstring: true
            show_signature_annotations: true
            show_signature: true
            show_source: false
            show_symbol_type_heading: true
            docstring_style: numpy
            docstring_section_style: list
            separate_signature: true
            merge_init_into_class: true
            inherited_members: true

nav:
  - Welcome: index.md
  - Guides:
      - Getting started: gettingstarted.md
      - Spox interoperability: spoxintegration.md
      - Inference: inference.md
      - Adding metadata to an artifact: adding-metadata.md
      - Experimental features: experimental.md
  - How it works: how-it-works.md
  - API Documentation:
      - Array: api/array.md
      - Data types: api/data-types.md
      - Building ONNX models: api/building.md
      - Constants: api/constants.md
      - Functions:
          - Creation functions: api/creation-functions.md
          - Data type functions: api/data-type-functions.md
          - Element-wise functions: api/elementwise-functions.md
          - Indexing functions: api/indexing-functions.md
          - Linear algebra functions: api/linear-algebra-functions.md
          - Manipulation functions: api/manipulation-functions.md
          - Searching functions: api/searching-functions.md
          - Set functions: api/set-functions.md
          - Sorting functions: api/sorting-functions.md
          - Statistical functions: api/statistical-functions.md
          - Utility functions: api/utility-functions.md
      - Inspection: api/inspection.md
      - Extensions: api/extensions.md
      - Types: api/types.md
  - Changelog: CHANGELOG.md
  - Motivation: motivation.md

markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.snippets
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true
